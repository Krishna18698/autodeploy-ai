# Grafana-managed alert rules (import via the Grafana Cloud UI or API).
groups:
  - name: autodeploy
    interval: 1m
    rules:
      # The worker reports this every 10 s; silence means the VM, the worker or
      # its telemetry is down (an outside check of the site would also catch this).
      - alert: ServerSilent
        expr: absent_over_time(autodeploy_outbox_backlog[10m]) == 1
        annotations:
          summary: No metrics from the server for 10 minutes (VM, worker or telemetry down)
      - alert: QueueBacklog
        expr: max(autodeploy_queue_oldest_ms{type="deployment.build"}) > 600000
        for: 5m
        annotations:
          summary: Builds have waited over 10 minutes to start
          runbook: docs/runbooks/queue-backlog.md
      - alert: DeadLetteredJobs
        expr: sum(autodeploy_queue_depth{status="dead"}) > 0
        for: 1m
        annotations:
          summary: Jobs exhausted their retries and are in the dead-letter state
      - alert: LeasesBeingReaped
        expr: increase(autodeploy_leases_reaped_total[15m]) > 3
        annotations:
          summary: Workers are losing job leases (crashes, OOM kills or hung builds)
      - alert: ConsumerLag
        expr: max(autodeploy_consumer_lag) > 500
        for: 10m
        annotations:
          summary: A Kafka consumer group is falling behind
      - alert: OutboxBacklog
        expr: autodeploy_outbox_backlog > 200
        for: 5m
        annotations:
          summary: Events are not reaching Kafka (relay stuck or broker down)
      - alert: AiProviderCircuitOpen
        expr: max by (provider) (autodeploy_ai_breaker_open) == 1
        for: 15m
        annotations:
          summary: An AI provider has been failing; recovery is falling back
      # Only judged when at least 4 builds ran in the hour: an idle hour is not a failure.
      - alert: BuildSuccessRateLow
        expr: |
          sum(increase(autodeploy_build_duration_seconds_count{outcome="ok"}[1h]))
            / (sum(increase(autodeploy_build_duration_seconds_count[1h])) > 3) < 0.5
        for: 30m
        annotations:
          summary: Fewer than half of build attempts are succeeding
