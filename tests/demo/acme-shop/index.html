<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Shop</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f3ee; color: #1d1b18; font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
      .card { width: min(420px, 90vw); background: #fff; border-radius: 18px; padding: 28px; box-shadow: 0 30px 80px -30px rgba(40, 30, 10, 0.35); }
      .tag { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #9a6b2f; }
      h1 { margin: 8px 0 4px; font-size: 30px; letter-spacing: -0.02em; }
      p { margin: 0 0 22px; color: #6b655c; }
      .row { display: flex; align-items: center; justify-content: space-between; }
      #price { font-size: 26px; font-weight: 700; }
      button { border: 0; border-radius: 999px; background: #1d1b18; color: #fff; padding: 12px 20px; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="tag">New season</div>
      <h1>Field Jacket</h1>
      <p>Waxed cotton, brass hardware, built to outlast trends.</p>
      <div class="row"><span id="price">—</span><button>Add to cart</button></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
