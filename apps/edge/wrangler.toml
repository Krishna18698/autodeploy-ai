# One Worker serves every user site: *.<PLATFORM_DOMAIN>/*
name = "autodeploy-edge"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false

[vars]
PLATFORM_DOMAIN = "autodeploy.localhost"
# "kv" in production (routes mirrored to Workers KV); "api" locally (ask the origin).
ROUTE_MODE = "api"
API_URL = "http://127.0.0.1:4000"
S3_ENDPOINT = "http://127.0.0.1:8333"
S3_BUCKET = "autodeploy"
S3_REGION = "us-east-1"
# Secrets (set with `wrangler secret put` in production; .dev.vars locally):
#   INTERNAL_TOKEN, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY

# Production: `pnpm --filter @autodeploy/edge deploy --env production`.
# The *.<domain>/* route is owned by Terraform (infra/terraform/cloudflare.tf).
# Secrets: wrangler secret put INTERNAL_TOKEN|S3_ACCESS_KEY_ID|S3_SECRET_ACCESS_KEY --env production
[env.production]
name = "autodeploy-edge"
workers_dev = false

[env.production.vars]
PLATFORM_DOMAIN = "autodeploy.dpdns.org"
ROUTE_MODE = "kv"
API_URL = "https://api.autodeploy.dpdns.org"
S3_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
S3_BUCKET = "autodeploy-ks-artifacts"
S3_REGION = "us-east-005"

[[env.production.kv_namespaces]]
binding = "ROUTES"
id = "4e94061762e341a4944646d2006ef6a9"
